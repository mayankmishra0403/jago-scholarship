<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b3b2e" />
    <meta name="description" content="JagoScholarship — one app for all Ministry of Tribal Affairs scholarships: apply, track, verify and receive." />

    <!--
      Script fonts. The app ships four scripts (Latin, Devanagari, Ol Chiki,
      Odia) and the tribal-language surfaces are the whole point, so the fonts
      are not optional decoration — without them Santali renders as tofu.
      Google Fonts splits each family by unicode-range, so a reader using only
      English downloads the Latin subset and nothing else. font-display:swap
      keeps text visible on a slow link instead of blank.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Ol+Chiki:wght@400;500;600;700&family=Noto+Sans+Oriya:wght@400;500;600;700&display=swap"
    />
    <title>JagoScholarship · Ministry of Tribal Affairs</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
